  <!-- ═══════════════════════════════════════════════════
       CHAT UI CONTROLLER — 2026 Enhanced
       ═══════════════════════════════════════════════════ -->
  <script>
    (function () {
      'use strict';

      /* ════════════════════════════════════════════════════
         ELEMENTS
         ════════════════════════════════════════════════════ */
      var elWelcome = document.getElementById('chat-welcome');
      var elViewport = document.getElementById('chat-viewport');
      var elTyping = document.getElementById('chat-typing');
      var elTypingLabel = document.getElementById('chat-typing-label');
      var elInput = document.getElementById('chat-input');
      var elSendBtn = document.getElementById('chat-send-btn');
      var elSuggestions = document.getElementById('chat-suggestions');
      var elCharCount = document.getElementById('chat-char-count');
      var elToolbar = document.getElementById('chat-toolbar');
      var elToolbarCount = document.getElementById('chat-toolbar-count');
      var elExportBtn = document.getElementById('chat-export-btn');
      var elClearBtn = document.getElementById('chat-clear-btn');
      var elScrollBtn = document.getElementById('chat-scroll-btn');
      var elScrollBadge = document.getElementById('chat-scroll-badge');
      var elStatusPill = document.getElementById('chat-status-pill');
      var elStatusLabel = document.getElementById('chat-status-label');
      var elHeader = document.getElementById('site-header');
      var promptCards = document.querySelectorAll('.chat-prompt-card');

      /* ════════════════════════════════════════════════════
         STATE
         ════════════════════════════════════════════════════ */
      var history = [];   // [{role, text, nicCards?, source?, timestamp}]
      var isProcessing = false;
      var lastUserMsg = null; // for retry
      var isScrolledUp = false;
      var unreadCount = 0;
      var cancelStream = null; // function to cancel active stream

      /* ════════════════════════════════════════════════════
         THEME
         ════════════════════════════════════════════════════ */
      var html = document.documentElement;
      var themeToggles = document.querySelectorAll('.theme-toggle');

      function applyTheme(t) {
        if (t === 'light') {
          html.setAttribute('data-theme', 'light');
          themeToggles.forEach(function (b) { b.setAttribute('aria-label', 'Switch to dark mode'); });
        } else {
          html.removeAttribute('data-theme');
          themeToggles.forEach(function (b) { b.setAttribute('aria-label', 'Switch to light mode'); });
        }
      }

      (function () {
        var stored = localStorage.getItem('nic-theme');
        if (stored === 'light' || stored === 'dark') { applyTheme(stored); }
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) { applyTheme('light'); }
      })();

      themeToggles.forEach(function (b) {
        b.addEventListener('click', function () {
          var next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
          applyTheme(next);
          try { localStorage.setItem('nic-theme', next); } catch (_) { }
        });
      });

      /* ════════════════════════════════════════════════════
         HEADER SCROLL
         ════════════════════════════════════════════════════ */
      window.addEventListener('scroll', function () {
        elHeader.classList.toggle('scrolled', window.scrollY > 40);
      }, { passive: true });

      /* ════════════════════════════════════════════════════
         ONLINE / OFFLINE STATUS
         ════════════════════════════════════════════════════ */
      function updateOnlineStatus() {
        var online = navigator.onLine;
        document.querySelectorAll('[data-chat-status-pill]').forEach(function (pill) {
          pill.classList.toggle('chat-status-pill--offline', !online);
        });
        document.querySelectorAll('[data-chat-status-label]').forEach(function (label) {
          label.textContent = online ? 'Online' : 'Offline Mode';
        });
      }
      updateOnlineStatus();
      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);

      /* ════════════════════════════════════════════════════
         SCROLL-TO-BOTTOM FAB
         ════════════════════════════════════════════════════ */
      elViewport.addEventListener('scroll', onViewportScroll, { passive: true });

      function onViewportScroll() {
        var dist = elViewport.scrollHeight - elViewport.scrollTop - elViewport.clientHeight;
        isScrolledUp = dist > 120;
        if (elScrollBtn) elScrollBtn.classList.toggle('visible', isScrolledUp);
        if (!isScrolledUp) {
          unreadCount = 0;
          updateScrollBadge();
        }
      }

      function updateScrollBadge() {
        if (!elScrollBadge) return;
        if (unreadCount > 0) {
          elScrollBadge.textContent = unreadCount > 9 ? '9+' : String(unreadCount);
          elScrollBadge.classList.add('visible');
        } else {
          elScrollBadge.textContent = '';
          elScrollBadge.classList.remove('visible');
        }
      }

      if (elScrollBtn) {
        elScrollBtn.addEventListener('click', function () { scrollToBottom(true); });
      }

      function scrollToBottom(smooth) {
        requestAnimationFrame(function () {
          elViewport.scrollTo({
            top: elViewport.scrollHeight,
            behavior: smooth ? 'smooth' : 'instant'
          });
        });
      }

      /* ════════════════════════════════════════════════════
         CONVERSATION TOOLBAR
         ════════════════════════════════════════════════════ */
      function updateToolbar() {
        var userCount = history.filter(function (m) { return m.role === 'user'; }).length;
        if (elToolbar) elToolbar.classList.toggle('visible', userCount > 0);
        if (elToolbarCount) {
          elToolbarCount.textContent = userCount + (userCount === 1 ? ' message' : ' messages');
        }
      }

      if (elExportBtn) {
        elExportBtn.addEventListener('click', exportConversation);
      }

      if (elClearBtn) {
        elClearBtn.addEventListener('click', function () {
          if (!history.length) return;
          if (!confirm('Clear this conversation? This cannot be undone.')) return;
          clearAll();
        });
      }

      function clearAll() {
        if (cancelStream) { cancelStream(); cancelStream = null; }
        // Remove all messages (keep typing indicator)
        Array.from(elViewport.children).forEach(function (el) {
          if (!el.classList.contains('chat-typing')) el.remove();
        });
        history = [];
        lastUserMsg = null;
        window.NICEngine.clearSession();
        showWelcome();
        elSuggestions.innerHTML = '';
        elSuggestions.classList.remove('visible');
        updateToolbar();
        elInput.focus();
      }

      function exportConversation() {
        if (!history.length) return;
        var lines = [
          '# NIC AI Assistant — Conversation Export',
          '# Exported: ' + new Date().toLocaleString(),
          '', '---', ''
        ];
        history.forEach(function (msg) {
          lines.push((msg.role === 'user' ? '## You' : '## AI Assistant') + '\n' + msg.text);
          lines.push('');
        });
        var blob = new Blob([lines.join('\n')], { type: 'text/markdown; charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'nic-chat-' + new Date().toISOString().slice(0, 10) + '.md';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      }

      /* ════════════════════════════════════════════════════
         WELCOME STATE HELPERS
         ════════════════════════════════════════════════════ */
      function showWelcome() {
        elWelcome.style.display = '';
        elViewport.style.display = 'none';
      }

      function hideWelcome() {
        elWelcome.style.display = 'none';
        elViewport.style.display = 'flex';
      }

      /* ════════════════════════════════════════════════════
         SESSION PERSISTENCE
         ════════════════════════════════════════════════════ */
      function restoreSession() {
        var session = window.NICEngine.loadSession();
        if (!session || !session.history || !session.history.length) return;

        history = session.history;
        hideWelcome();

        // Restore banner
        var banner = document.createElement('div');
        banner.className = 'chat-restore-banner';
        banner.setAttribute('aria-label', 'Conversation restored from previous session');
        banner.innerHTML =
          '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>' +
          ' Conversation restored from ' + relativeTime(session.savedAt);
        elViewport.insertBefore(banner, elTyping);

        // Render all stored messages
        history.forEach(function (msg) { renderStoredMessage(msg); });

        updateToolbar();
        requestAnimationFrame(function () {
          elViewport.scrollTop = elViewport.scrollHeight;
        });
      }

      function renderStoredMessage(msg) {
        var msgEl = document.createElement('div');
        msgEl.className = 'chat-message chat-message--' + msg.role;
        if (msg.timestamp) msgEl.setAttribute('data-timestamp', msg.timestamp);

        if (msg.role === 'user') {
          msgEl.innerHTML =
            '<div class="chat-message__content">' +
            '<div class="chat-message__text">' + escapeHTML(msg.text) + '</div>' +
            (msg.timestamp ? '<time class="chat-message__time" data-ts="' + msg.timestamp + '">' + relativeTime(msg.timestamp) + '</time>' : '') +
            '</div>';
        } else {
          var nicCardsHTML = (msg.nicCards || []).map(buildNICCardHTML).join('');
          var sourceTag = buildSourceTag(msg.source || 'ai');
          var ts = msg.timestamp || Date.now();
          msgEl.innerHTML = buildAssistantShell(nicCardsHTML, renderMarkdown(msg.text), sourceTag, ts);
          wireAssistantHandlers(msgEl, msg.text, msg.nicCards || []);
        }

        elViewport.insertBefore(msgEl, elTyping);
      }

      /* ════════════════════════════════════════════════════
         ENHANCED MARKDOWN RENDERER
         ════════════════════════════════════════════════════ */
      function renderMarkdown(raw) {
        var text = String(raw || '')
          .replace(/<(thought|think|reasoning|scratchpad)>[\s\S]*?<\/\1>/gi, '')
          .replace(/<\|channel\|?>thought[\s\S]*?<\|?channel\|?>/gi, '');
        var codeBlocks = [];

        // 1. Extract fenced code blocks (protect from further processing)
        text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, function (_, lang, code) {
          var i = codeBlocks.length;
          codeBlocks.push({ lang: lang || 'text', code: code.trim() });
          return '\x00CB' + i + '\x00';
        });

        // 2. Inline formatting
        text = text
          .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*([^*\n]+?)\*/g, '<em>$1</em>')
          .replace(/`([^`\n]+?)`/g, '<code>$1</code>');

        // 3. Headers
        text = text
          .replace(/^### (.+)$/gm, '<h4>$1</h4>')
          .replace(/^## (.+)$/gm, '<h3>$1</h3>')
          .replace(/^# (.+)$/gm, '<h2>$1</h2>');

        // 4. Blockquotes
        text = text.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');

        // 5. Horizontal rules
        text = text.replace(/^---+$/gm, '<hr>');

        // 6. Ordered lists
        text = text.replace(/((?:^\d+\. .+$\n?)+)/gm, function (block) {
          var items = block.trim().split('\n').map(function (l) {
            return '<li>' + l.replace(/^\d+\. /, '') + '</li>';
          });
          return '<ol>' + items.join('') + '</ol>';
        });

        // 7. Unordered lists (supporting -, *, and •)
        text = text.replace(/((?:^[-*•] .+$\n?)+)/gm, function (block) {
          var items = block.trim().split('\n').map(function (l) {
            return '<li>' + l.replace(/^[-*•] /, '') + '</li>';
          });
          return '<ul>' + items.join('') + '</ul>';
        });

        // 8. Paragraphs (group non-block lines)
        var BLOCK_START = /^<(h[2-4]|ul|ol|blockquote|hr|div|pre)|\x00CB/;
        var paras = [];
        var buf = [];

        text.split('\n\n').forEach(function (chunk) {
          var t = chunk.trim();
          if (!t) return;
          if (BLOCK_START.test(t)) {
            if (buf.length) { paras.push('<p>' + buf.join(' ') + '</p>'); buf = []; }
            paras.push(t);
          } else {
            paras.push('<p>' + t.replace(/\n/g, '<br>') + '</p>');
          }
        });
        if (buf.length) paras.push('<p>' + buf.join(' ') + '</p>');
        text = paras.join('\n');

        // 9. Restore code blocks
        codeBlocks.forEach(function (blk, i) {
          var escaped = blk.code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          var encodedCode = encodeURIComponent(blk.code);
          var html =
            '<div class="chat-code-block">' +
            '<div class="chat-code-block__header">' +
            '<span class="chat-code-block__lang">' + escapeHTML(blk.lang) + '</span>' +
            '<button class="chat-code-block__copy" type="button" data-code="' + encodedCode + '" aria-label="Copy code">' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
            ' Copy' +
            '</button>' +
            '</div>' +
            '<pre><code>' + escaped + '</code></pre>' +
            '</div>';
          text = text.replace('\x00CB' + i + '\x00', html);
        });

        return text;
      }

      /* ════════════════════════════════════════════════════
         NIC CARD HTML
         ════════════════════════════════════════════════════ */
      function buildNICCardHTML(r) {
        return (
          '<div class="chat-nic-card">' +
          '<div class="chat-nic-card__header">' +
          '<span class="chat-nic-card__badge">' + (r.format === 'old' ? 'OLD' : 'NEW') + ' FORMAT</span>' +
          '<span class="chat-nic-card__nic">' + escapeHTML(r.nic) + '</span>' +
          '</div>' +
          '<div class="chat-nic-card__grid">' +
          '<div class="chat-nic-card__fact"><span class="chat-nic-card__label">Date of Birth</span><span class="chat-nic-card__value">' + escapeHTML(r.dob) + '</span></div>' +
          '<div class="chat-nic-card__fact"><span class="chat-nic-card__label">Age</span><span class="chat-nic-card__value">' + escapeHTML(r.ageText) + '</span></div>' +
          '<div class="chat-nic-card__fact"><span class="chat-nic-card__label">Gender</span><span class="chat-nic-card__value">' + escapeHTML(r.gender) + '</span></div>' +
          '<div class="chat-nic-card__fact"><span class="chat-nic-card__label">Weekday</span><span class="chat-nic-card__value">' + escapeHTML(r.weekday) + '</span></div>' +
          '<div class="chat-nic-card__fact"><span class="chat-nic-card__label">Zodiac</span><span class="chat-nic-card__value">' + r.zodiac.symbol + ' ' + escapeHTML(r.zodiac.name) + '</span></div>' +
          '<div class="chat-nic-card__fact"><span class="chat-nic-card__label">Generation</span><span class="chat-nic-card__value">' + escapeHTML(r.generation) + '</span></div>' +
          '</div>' +
          '<div class="chat-nic-card__footer">' +
          '<span class="chat-nic-card__detail">' + escapeHTML(r.altFormatLabel) + ': <code>' + escapeHTML(r.altFormat) + '</code></span>' +
          '<span class="chat-nic-card__detail">Day Code: <code>' + r.dayOfYear + '</code></span>' +
          '<span class="chat-nic-card__detail">Voter: ' + escapeHTML(r.voterStatus) + '</span>' +
          '</div>' +
          '</div>'
        );
      }

      /* ════════════════════════════════════════════════════
         SOURCE TAG + ASSISTANT SHELL HTML
         ════════════════════════════════════════════════════ */
      function buildSourceTag(source) {
        if (source === 'hybrid')
          return '<span class="chat-source-tag"><span class="chat-source-dot chat-source-dot--local"></span>Local + AI</span>';
        if (source === 'local')
          return '<span class="chat-source-tag"><span class="chat-source-dot chat-source-dot--local"></span>Local Engine</span>';
        return '<span class="chat-source-tag"><span class="chat-source-dot chat-source-dot--ai"></span>Gemma 4 AI</span>';
      }

      function buildAssistantShell(nicCardsHTML, textHTML, sourceTag, ts) {
        return (
          '<div class="chat-message__avatar" aria-hidden="true">' +
          '<svg width="20" height="20" viewBox="0 0 48 48" fill="none"><path d="M24 8L26.5 18.5H37L28.5 25L31 35.5L24 29L17 35.5L19.5 25L11 18.5H21.5L24 8Z" fill="var(--brass)" opacity="0.85"/></svg>' +
          '</div>' +
          '<div class="chat-message__content">' +
          nicCardsHTML +
          '<div class="chat-message__text">' + textHTML + '</div>' +
          '<div class="chat-message__meta">' +
          sourceTag +
          '<div class="chat-reaction-bar" role="group" aria-label="Rate this response">' +
          '<button class="chat-reaction-btn" type="button" aria-label="Helpful" title="Helpful" data-reaction="up">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>' +
          '</button>' +
          '<button class="chat-reaction-btn" type="button" aria-label="Not helpful" title="Not helpful" data-reaction="down">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10z"/><path d="M17 2h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg>' +
          '</button>' +
          '</div>' +
          '<time class="chat-message__time" data-ts="' + ts + '">' + relativeTime(ts) + '</time>' +
          '<button class="chat-copy-btn" type="button" aria-label="Copy response" title="Copy response">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
          '</button>' +
          '</div>' +
          '</div>'
        );
      }

      /* ════════════════════════════════════════════════════
         WIRE HANDLERS (copy, code copy, reactions, timestamps)
         ════════════════════════════════════════════════════ */
      function wireAssistantHandlers(msgEl, plainText, nicCards) {
        // Copy whole message
        var copyBtn = msgEl.querySelector('.chat-copy-btn');
        if (copyBtn) {
          copyBtn.addEventListener('click', function () {
            var toCopy = plainText;
            if (nicCards && nicCards.length) {
              toCopy = nicCards.map(function (c) {
                return 'NIC: ' + c.nic + '\nDOB: ' + c.dob + '\nGender: ' + c.gender + '\nAge: ' + c.ageText;
              }).join('\n\n') + '\n\n' + plainText;
            }
            navigator.clipboard.writeText(toCopy).then(function () {
              copyBtn.classList.add('copied');
              setTimeout(function () { copyBtn.classList.remove('copied'); }, 2000);
            }).catch(function () { });
          });
        }

        // Code block copy buttons (wired after full markdown render)
        wireCodeCopyHandlers(msgEl);

        // Reactions
        var reactionBtns = msgEl.querySelectorAll('.chat-reaction-btn');
        reactionBtns.forEach(function (btn) {
          btn.addEventListener('click', function () {
            var wasActive = btn.classList.contains('active');
            reactionBtns.forEach(function (b) { b.classList.remove('active'); });
            if (!wasActive) btn.classList.add('active');
          });
        });

        // Live timestamp updates
        var timeEl = msgEl.querySelector('time[data-ts]');
        if (timeEl) {
          var ts = Number(timeEl.getAttribute('data-ts'));
          setInterval(function () { timeEl.textContent = relativeTime(ts); }, 60000);
        }
      }

      function wireCodeCopyHandlers(container) {
        container.querySelectorAll('.chat-code-block__copy').forEach(function (btn) {
          // avoid double-binding
          if (btn.dataset.wired) return;
          btn.dataset.wired = 'true';
          btn.addEventListener('click', function () {
            var code = decodeURIComponent(btn.getAttribute('data-code') || '');
            navigator.clipboard.writeText(code).then(function () {
              btn.innerHTML =
                '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg> Copied!';
              btn.classList.add('copied');
              setTimeout(function () {
                btn.innerHTML =
                  '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy';
                btn.classList.remove('copied');
              }, 2000);
            }).catch(function () { });
          });
        });
      }

      /* ════════════════════════════════════════════════════
         ADD MESSAGE TO VIEWPORT
         ════════════════════════════════════════════════════ */
      function addMessage(role, plainText, nicCards, source, ts) {
        hideWelcome();
        var timestamp = ts || Date.now();

        var msgEl = document.createElement('div');
        msgEl.className = 'chat-message chat-message--' + role;
        msgEl.setAttribute('data-timestamp', timestamp);

        if (role === 'user') {
          msgEl.innerHTML =
            '<div class="chat-message__content">' +
            '<div class="chat-message__text">' + escapeHTML(plainText) + '</div>' +
            '<time class="chat-message__time" data-ts="' + timestamp + '">' + relativeTime(timestamp) + '</time>' +
            '</div>';
        } else {
          var nicHTML = (nicCards || []).map(buildNICCardHTML).join('');
          var src = buildSourceTag(source || 'ai');
          // Empty text — will be filled by streaming
          msgEl.innerHTML = buildAssistantShell(nicHTML, '', src, timestamp);
          wireAssistantHandlers(msgEl, plainText, nicCards || []);
        }

        // Insert before typing indicator
        elViewport.insertBefore(msgEl, elTyping);

        if (isScrolledUp && role === 'assistant') {
          unreadCount++;
          updateScrollBadge();
        } else {
          scrollToBottom();
        }

        return msgEl;
      }

      /* ════════════════════════════════════════════════════
         STREAMING TYPEWRITER — fills .chat-message__text
         ════════════════════════════════════════════════════ */
      function streamIntoMessage(msgEl, fullText, onComplete) {
        var textEl = msgEl.querySelector('.chat-message__text');
        if (!textEl) { if (onComplete) onComplete(); return; }

        // Initial cursor
        textEl.innerHTML = '<span class="chat-stream-cursor" aria-hidden="true"></span>';

        var accumulated = '';
        var aborted = false;

        var cancel = window.NICEngine.simulateStream(
          fullText,
          function onChunk(chunk) {
            if (aborted) return;
            accumulated += chunk;
            // Quick preview render (bold + code only — fast)
            var preview = accumulated
              .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
              .replace(/`([^`]+)`/g, '<code>$1</code>');
            textEl.innerHTML = '<p>' + preview + '</p><span class="chat-stream-cursor" aria-hidden="true"></span>';
            if (!isScrolledUp) scrollToBottom();
          },
          function onDone(wasAborted) {
            if (!wasAborted && !aborted) {
              // Final full markdown render
              textEl.innerHTML = renderMarkdown(fullText);
              wireCodeCopyHandlers(textEl);
            }
            cancelStream = null;
            if (onComplete) onComplete();
          }
        );

        cancelStream = function () {
          aborted = true;
          cancel();
          // Show final render immediately on cancel
          textEl.innerHTML = renderMarkdown(fullText);
          wireCodeCopyHandlers(textEl);
          cancelStream = null;
          if (onComplete) onComplete();
        };
      }

      /* ════════════════════════════════════════════════════
         TYPING INDICATOR
         ════════════════════════════════════════════════════ */
      function showTyping(phase) {
        elTyping.setAttribute('aria-hidden', 'false');
        elTyping.classList.add('visible');
        if (elTypingLabel) elTypingLabel.textContent = phase || 'Thinking…';
        if (!isScrolledUp) scrollToBottom();
      }

      function setTypingPhase(phase) {
        if (elTypingLabel) elTypingLabel.textContent = phase;
      }

      function hideTyping() {
        elTyping.setAttribute('aria-hidden', 'true');
        elTyping.classList.remove('visible');
      }

      /* ════════════════════════════════════════════════════
         SUGGESTION CHIPS
         ════════════════════════════════════════════════════ */
      function showSuggestions(list) {
        elSuggestions.innerHTML = '';
        list.forEach(function (text) {
          var chip = document.createElement('button');
          chip.className = 'chat-suggestion-chip';
          chip.type = 'button';
          chip.textContent = text;
          chip.addEventListener('click', function () {
            elInput.value = text;
            elInput.dispatchEvent(new Event('input'));
            sendMessage();
          });
          elSuggestions.appendChild(chip);
        });
        elSuggestions.classList.add('visible');
      }

      function hideSuggestions() {
        elSuggestions.classList.remove('visible');
      }

      /* ════════════════════════════════════════════════════
         ERROR BUBBLE WITH RETRY
         ════════════════════════════════════════════════════ */
      function addError(errText, retryFn) {
        var errEl = document.createElement('div');
        errEl.className = 'chat-message chat-message--error';
        errEl.innerHTML =
          '<div class="chat-error-bubble">' +
          '<svg class="chat-error-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
          '<span>' + escapeHTML(errText) + '</span>' +
          (retryFn ? '<button class="chat-retry-btn" type="button">Retry</button>' : '') +
          '</div>';

        if (retryFn) {
          errEl.querySelector('.chat-retry-btn').addEventListener('click', function () {
            errEl.remove();
            retryFn();
          });
        }

        elViewport.insertBefore(errEl, elTyping);
        scrollToBottom();
      }

      /* ════════════════════════════════════════════════════
         UTILITY
         ════════════════════════════════════════════════════ */
      function escapeHTML(str) {
        var d = document.createElement('div');
        d.textContent = String(str == null ? '' : str);
        return d.innerHTML;
      }

      function relativeTime(ts) {
        var diff = (Date.now() - ts) / 1000;
        if (diff < 10) return 'just now';
        if (diff < 60) return Math.floor(diff) + 's ago';
        if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
        if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
        return new Date(ts).toLocaleDateString();
      }

      /* ════════════════════════════════════════════════════
         INPUT AREA — auto-expand, char counter, keyboard
         ════════════════════════════════════════════════════ */
      elInput.addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 140) + 'px';
        elSendBtn.disabled = this.value.trim().length === 0;
        var len = this.value.length;
        if (len > 800) {
          elCharCount.textContent = len + '/1000';
          elCharCount.classList.add('visible');
        } else {
          elCharCount.textContent = '';
          elCharCount.classList.remove('visible');
        }
      });

      elSendBtn.addEventListener('click', sendMessage);

      elInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        } else if (e.key === 'Escape') {
          this.value = '';
          this.style.height = 'auto';
          elSendBtn.disabled = true;
          elCharCount.textContent = '';
          elCharCount.classList.remove('visible');
          this.blur();
        }
      });

      promptCards.forEach(function (card) {
        card.addEventListener('click', function () {
          var prompt = card.getAttribute('data-prompt');
          if (prompt) {
            elInput.value = prompt;
            elInput.dispatchEvent(new Event('input'));
            sendMessage();
          }
        });
      });

      /* ════════════════════════════════════════════════════
         MAIN SEND
         ════════════════════════════════════════════════════ */
      async function sendMessage() {
        var text = elInput.value.trim();
        if (!text || isProcessing) return;

        isProcessing = true;
        elSendBtn.disabled = true;
        lastUserMsg = text;

        // Haptic feedback (mobile)
        if (navigator.vibrate) navigator.vibrate(8);

        // Clear input
        elInput.value = '';
        elInput.style.height = 'auto';
        elCharCount.textContent = '';
        elCharCount.classList.remove('visible');
        hideSuggestions();

        var userTs = Date.now();

        // Add user message
        addMessage('user', text, [], null, userTs);
        history.push({ role: 'user', text: text, timestamp: userTs });

        // Phase 1 — thinking
        showTyping('Thinking\u2026');

        try {
          // Show NIC-specific phase if NICs detected
          var nics = window.NICEngine.extractNICs(text);
          if (nics.length > 0) {
            setTypingPhase('Decoding NIC locally\u2026');
            await sleep(350);
            setTypingPhase('Generating response\u2026');
          }

          var result = await window.NICEngine.processMessage(text, history);

          hideTyping();

          // Add assistant message shell (empty text, streams in below)
          var msgEl = addMessage('assistant', '', result.nicCards, result.source, Date.now());

          // Stream narrative text in word-by-word
          await streamPromise(msgEl, result.narrative);

          // Push to history
          var aTs = Date.now();
          history.push({
            role: 'assistant',
            text: result.narrative,
            nicCards: result.nicCards,
            source: result.source,
            timestamp: aTs
          });

          window.NICEngine.saveSession(history);
          updateToolbar();

          if (result.suggestions && result.suggestions.length) {
            showSuggestions(result.suggestions);
          }

        } catch (err) {
          hideTyping();
          var errMsg = err.message === 'timeout'
            ? 'Request timed out. NIC data decoded locally — AI narrative unavailable.'
            : (navigator.onLine ? 'Something went wrong. Please try again.' : 'You appear to be offline. NIC decoding works locally.');

          var capturedMsg = lastUserMsg;
          addError(errMsg, function () {
            elInput.value = capturedMsg || '';
            elInput.dispatchEvent(new Event('input'));
            sendMessage();
          });
        }

        isProcessing = false;
        elSendBtn.disabled = elInput.value.trim().length === 0;
        elInput.focus();
      }

      // Wrap streaming in a Promise so sendMessage can await it
      function streamPromise(msgEl, text) {
        return new Promise(function (resolve) {
          streamIntoMessage(msgEl, text, resolve);
        });
      }

      function sleep(ms) {
        return new Promise(function (resolve) { setTimeout(resolve, ms); });
      }

      /* ════════════════════════════════════════════════════
         TIMESTAMP REFRESH (every 30s)
         ════════════════════════════════════════════════════ */
      setInterval(function () {
        document.querySelectorAll('time[data-ts]').forEach(function (el) {
          el.textContent = relativeTime(Number(el.getAttribute('data-ts')));
        });
      }, 30000);

      /* ════════════════════════════════════════════════════
         INIT
         ════════════════════════════════════════════════════ */
      restoreSession();
      setTimeout(function () { elInput.focus(); }, 300);

    })();
  </script>

</body>
