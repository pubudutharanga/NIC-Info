        - paragraph [ref=e42]: NIC Info provides mathematically sound cryptographic syntax validation and demographic data extraction in compliance with Sri Lanka's standardized identity numbering system. This document outlines the official format architecture, migration rules between legacy and modern cards, and ethical usage parameters.
