          - text: Only process National Identity Card credentials belonging to yourself, consenting clients, or individuals undergoing legitimate organizational onboarding and verification workflows.
        - listitem [ref=e154]:
          - strong [ref=e155]: "Prohibition of Batch Harvesting:"
