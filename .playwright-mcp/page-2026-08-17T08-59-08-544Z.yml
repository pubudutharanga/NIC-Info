      - heading "3. Algorithmic Record Migration (9 to 12 Digits)" [level=2] [ref=e129]
      - paragraph [ref=e130]: "For system architects, enterprise KYC pipelines, and database administrators upgrading user registries from legacy 9-digit records to standardized 12-digit format, follow this precise 4-step transformation protocol:"
      - list [ref=e131]:
        - listitem [ref=e132]:
          - strong [ref=e133]: "Step 1 (Year Expansion):"
          - text: Prepend the century identifier
          - code [ref=e134]: "19"
          - text: directly preceding the initial 2 digits of the legacy number (applicable for all 20th-century issuances).
        - listitem [ref=e135]:
          - strong [ref=e136]: "Step 2 (Date Preservation):"
          - text: Maintain the sequential 3-digit day and gender integer directly following the expanded year without modification.
        - listitem [ref=e137]:
          - strong [ref=e138]: "Step 3 (Zero Insertion):"
          - text: Insert a single zero (
          - code [ref=e139]: "0"
          - text: ) immediately preceding the 4-digit serial check number to expand the serial identifier from 4 to 5 decimal digits.
        - listitem [ref=e140]:
          - strong [ref=e141]: "Step 4 (Suffix Deprecation):"
          - text: Strip and discard the terminal control character (
          - code [ref=e142]: V
          - text: or
          - code [ref=e143]: X
          - text: ).
